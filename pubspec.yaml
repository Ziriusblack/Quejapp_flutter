name: quejapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Gestión de GPS y Permisos
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  
  # Gráficos e Historiales
  fl_chart: ^0.69.0
  
  # Peticiones HTTP al Backend (Spring Boot)
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.3.2
  sqflite: ^2.4.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F37003"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/